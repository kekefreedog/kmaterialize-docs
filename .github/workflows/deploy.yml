name: Deploy

# Builds the site and rsyncs it over SSH to the host, on every GitHub
# Release (so publishing a release is what ships a new version of the
# live site), plus a manual trigger for one-off redeploys.
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22' # Node 20 is being deprecated by GitHub Actions

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: "Refuse to deploy a local file: dependency"
        # v1.4.0 was tagged/pushed with kmaterialize still pinned to
        # file:/Users/.../kmaterialize (a path that only exists on a dev
        # machine) - CI failed with a cryptic pnpm ENOENT instead of a
        # clear error. Fail fast here instead, before wasting time on an
        # install that can't work.
        run: node scripts/check-no-local-deps.mjs

      - name: Sync package.json version with release tag
        # Same idea as kmaterialize's publish.yml: the tag is the source of
        # truth, so package.json just follows it - no manual version bump
        # commit needed before tagging a release.
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TARGET_VERSION="${{ github.event.release.tag_name || github.ref_name }}"
          TARGET_VERSION="${TARGET_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TARGET_VERSION" ]; then
            echo "Updating package.json version from ${PKG_VERSION} to ${TARGET_VERSION}"
            npm pkg set version="$TARGET_VERSION"
          else
            echo "Version already matches tag: ${PKG_VERSION}"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over rsync/ssh
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.DEPLOY_SSH_PORT }}" \
            build/ \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
